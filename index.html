<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用餐禮儀紅綠燈：虎媽媽追追追</title>
<style>
:root{
  --bg:#fff8ec; --ink:#4a3428; --soft:#8a7464; --line:#f0e2c8;
  --green2:#e4f7e9; --greenInk:#1d7a37; --red2:#fde8e5; --redInk:#b23a30; --orange:#ff9f43;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  -webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
button:focus-visible{outline:4px solid #4d96ff;outline-offset:3px}
button:disabled{opacity:.3;cursor:not-allowed}

/* ===== 注音：直排在字右邊，聲調在注音右上，輕聲在上方 ===== */
.zy{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .03em}
.zy .h{line-height:1}
.zy .b{display:inline-flex;align-items:center;margin-left:.06em;font-size:.3em;font-weight:500}
.zy .col{display:inline-flex;flex-direction:column;align-items:center;line-height:1.02;padding-right:.6em}
.zy .col i{font-style:normal;position:relative;display:block}
.zy .col i.lt{line-height:.55}
.zy .tn{position:absolute;left:100%;top:-.3em;font-weight:700;margin-left:.02em}

/* ===== 老師工具列 ===== */
#toolbar{position:fixed;top:0;left:0;right:0;height:8vh;display:flex;align-items:center;gap:.6vw;
  padding:0 1.2vw;background:#fff;border-bottom:3px solid var(--line);white-space:nowrap;overflow:hidden;z-index:11}
.tb{display:inline-flex;align-items:center;gap:.25em;padding:.15em .5em;border-radius:.6em;background:#f7efe2;flex:none;line-height:1}
.tb:hover{background:#efe2cb}
.tb .ic{font-size:1.1em}
.tb.off{opacity:.38;background:#e9e9e9}
.tb.hide{display:none}
.tb.star{background:#fff3c4}
.tb.paused{background:#ffd7cf}
.tb.tigerbtn{background:#ffe0cc;border:2px solid #ff9f43}
.spacer{flex:1 1 0;min-width:0}

.screen{position:absolute;top:8vh;left:0;right:0;bottom:0;display:none}
.screen.on{display:flex}
.fit{white-space:nowrap;overflow:hidden;line-height:1.45;padding:.08em 0}

/* ===== 首頁 ===== */
#home{flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:.8vh 3vw}
#home>*{flex:none}
.hhead{display:flex;align-items:center;justify-content:center;gap:2vw;width:94vw}
.hhead .mascot{--m:10vh}
.hhead .tiger{font-size:10vh;line-height:1;position:relative;animation:sway 2.4s ease-in-out infinite}
#hTitle{min-width:0;font-weight:900;color:#d9483d;text-shadow:0 .6vh 0 #ffe0b8;text-align:center}
.rules{background:#fff;border:5px solid var(--line);border-radius:3vh;padding:1vh 3vw;display:flex;flex-direction:column;gap:.2vh;max-width:94vw}
.rule{display:flex;align-items:center;gap:1.2vw;font-weight:700;white-space:nowrap;overflow:hidden;line-height:1.45}
.rule .ri{flex:none;width:4.6vh;height:4.6vh;display:flex;align-items:center;justify-content:center;font-size:3.8vh}
.mini{width:4.2vh;height:4.2vh;border-radius:50%;display:inline-block;flex:none}
.mini.g{background:radial-gradient(circle at 35% 35%,#a6f3bb,#2fa84f 60%,#1d7a36)}
.mini.r{background:radial-gradient(circle at 35% 35%,#ffb3aa,#e2574c 60%,#a8352b)}
.settings{background:#fffaf0;border:4px dashed #f0d39c;border-radius:3vh;padding:1vh 2vw;display:flex;flex-direction:column;gap:.5vh;width:94vw}
.srow{display:flex;align-items:center;gap:.8vw;white-space:nowrap;overflow:hidden}
.slabel{flex:none;font-weight:900;color:#a0622a;min-width:7.5em}
.opt{flex:none;padding:.15em .6em;border-radius:999px;background:#fff;border:3px solid #ead6b5;font-weight:800;line-height:1.3}
.opt.on{background:#ffb648;border-color:#f08c00;color:#fff}
.opt.cat.on{background:#7cc98f;border-color:#3e9e58}
.bigbtn{background:var(--orange);color:#fff;font-weight:900;border-radius:999px;padding:.3em 1.4em;
  box-shadow:0 .9vh 0 #d97a1c;white-space:nowrap;transition:transform .1s}
.bigbtn:active{transform:translateY(.6vh);box-shadow:0 .3vh 0 #d97a1c}
.bigbtn.alt{background:#8fa3b8;box-shadow:0 .9vh 0 #67798c}

/* ===== 遊戲 ===== */
#game{flex-direction:column;gap:1vh;padding:1vh 2.5vw 1.4vh}
#game>*{flex:none}
.status{height:6.5vh;display:flex;align-items:center;justify-content:space-between;gap:1.5vw}
#prog{font-weight:800;flex:0 1 auto;min-width:0}
#hearts{font-size:3.8vh;letter-spacing:.2vh;white-space:nowrap;overflow:hidden;flex:0 1 auto;min-width:0}
#hearts .lost{filter:grayscale(1);opacity:.35}
#hearts.hit{animation:shake .5s}
#timer{flex:none;display:flex;align-items:center;gap:.6vw;background:#fff;border:4px solid #f2c230;border-radius:999px;padding:.2vh 1.6vh;font-weight:900;font-size:3.6vh}
#timer.warn{border-color:#e2574c;background:#ffe9e5;animation:bump .5s}
#timer.wait{opacity:.55}
.shop{flex:none;display:flex;align-items:center;gap:.2vh;background:#fff;border:4px solid #e0d2b8;border-radius:999px;padding:.1vh 1.4vh;font-size:3.8vh;line-height:1.2;opacity:.6;filter:grayscale(.6)}
.shop small{font-size:2.1vh;font-weight:900;color:#a86d00}
.shop.can{opacity:1;filter:none;border-color:#f2c230;animation:canBuy 1s ease-in-out infinite alternate}
@keyframes canBuy{to{transform:scale(1.1);box-shadow:0 0 2vh #ffd54f}}
.tig.slip{animation:slip 1s ease-out}
@keyframes slip{0%{transform:translate(-50%,-62%) rotate(0)}40%{transform:translate(-50%,-90%) rotate(-200deg)}100%{transform:translate(-50%,-62%) rotate(-360deg)}}
.starbox{flex:none;background:#fff3c4;border:4px solid #f2c230;border-radius:999px;padding:.1vh 2vh;font-size:4.2vh;font-weight:900;color:#a86d00}
.starbox.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.3)}}

/* 賽道 */
.track{height:9vh;position:relative;background:#fff;border:5px solid var(--line);border-radius:2.4vh;overflow:hidden;transition:border-color .3s,background .3s}
.track.danger{border-color:#ff8a7e;background:#fff3f1}
.road{position:absolute;left:2%;right:2%;top:58%;height:2.6vh;transform:translateY(-50%);background:#e8dcc6;border-radius:999px}
.road::after{content:"";position:absolute;left:1%;right:1%;top:50%;border-top:.5vh dashed #fff;transform:translateY(-50%)}
.road .done{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#b8ecc6,#6fd08a);border-radius:999px;transition:width .6s}
.tick{position:absolute;top:58%;width:1vh;height:1vh;border-radius:50%;background:#cdbb9c;transform:translate(-50%,-50%)}
.tok{position:absolute;top:58%;transform:translate(-50%,-62%);transition:left .7s cubic-bezier(.3,1.4,.6,1);line-height:1;text-align:center;white-space:nowrap}
.kid{z-index:3;display:flex;flex-direction:column;align-items:center}
.kid.tok{transform:translate(-50%,-50%);top:48%}
.kid .kf{font-size:4.6vh;line-height:1;white-space:nowrap}
.kid .kt{font-size:1.7vh;font-weight:900;color:#fff;background:#ff7043;border-radius:999px;padding:0 .9vh;line-height:1.55;margin-top:-.3vh;white-space:nowrap;border:2px solid #fff}
.kid.danger{animation:wiggle .2s linear infinite}
.kid.danger .kt{background:#e53935}
.kid.win .kf{display:inline-block;animation:hop .4s ease-in-out infinite}
.tig.big{font-size:8.6vh;animation:tigBob .5s ease-in-out infinite}
@keyframes tigBob{50%{transform:translate(-50%,-70%) scale(1.08)}}
#goal.near{animation:goalGlow .8s ease-in-out infinite alternate}
@keyframes goalGlow{to{transform:translateY(-50%) scale(1.18);filter:drop-shadow(0 0 1.4vh #ffd54f)}}
.tig{font-size:6.8vh;z-index:2}
.tig .bow{position:absolute;right:-.6vh;top:-1.2vh;font-size:3vh}
.tig.stomp{animation:stomp .5s}
@keyframes stomp{30%{transform:translate(-50%,-80%) rotate(-8deg)}60%{transform:translate(-50%,-55%) rotate(5deg)}}
#goal{position:absolute;right:1%;top:50%;transform:translateY(-50%);font-size:6vh;line-height:1;text-align:center}
#goal small{display:block;font-size:2.4vh;font-weight:900;color:#a0622a;line-height:1.2}
.gap{position:absolute;left:50%;transform:translateX(-50%);top:3%;font-weight:900;font-size:2.4vh;color:#a0622a;background:#fff3c4;border-radius:999px;padding:0 1vh;white-space:nowrap;line-height:1.45}

.stage{flex:1 1 auto!important;min-height:0;display:flex;gap:1.5vw;position:relative}
.side{width:18vw;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1vh;padding-bottom:.5vh;min-width:0}
.side .bubble{width:100%;text-align:center;flex:none;min-height:5.4vh;display:flex;align-items:center;justify-content:center}
.side .mascot{--m:min(12vh,11vw)}
#caller{width:100%;background:#2b2b38;border-radius:2vh;padding:.5vh .6vw .8vh;text-align:center;border:4px solid #4a4a5a;position:relative;cursor:pointer;box-shadow:0 .6vh 0 #17171f;flex:none}
#caller::after{content:"";position:absolute;inset:4px;border:3px dotted #ffd54f;border-radius:1.5vh;opacity:.45;pointer-events:none}
#caller.rolling::after{animation:bulbs .25s steps(2) infinite;opacity:1}
@keyframes bulbs{50%{border-color:#ff5252}}
#clTop{color:#ffe082;font-weight:900;white-space:nowrap;overflow:hidden;line-height:1.45;font-size:2.4vh}
#clTop b{color:#fff;font-size:1.2em;margin-left:.4vh}
#clRow{display:flex;align-items:baseline;justify-content:center;gap:.4vh}
#clNum{font-family:"Arial Black","Arial",sans-serif;font-weight:900;color:#ff5252;text-shadow:0 0 1.2vh #ff1744,0 0 3vh #ff1744;line-height:1;font-size:7.4vh;letter-spacing:.3vh}
#clUnit{color:#ffcdd2;font-weight:900;font-size:2.6vh}
#caller.rolling #clNum{color:#ffd54f;text-shadow:0 0 1.2vh #ffab00}
#caller.land{animation:bump .5s}
#caller.land #clNum{animation:numFlash .9s 2}
@keyframes numFlash{50%{color:#fff;text-shadow:0 0 2vh #fff,0 0 4vh #ff1744}}
.scene{flex:1;min-height:0;min-width:0;background:#fff;border:6px solid var(--line);border-radius:3vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.6vh;padding:.8vh 3vw;position:relative;transition:border-color .3s}
.scene.ok{border-color:#7fd496;background:#fbfffc}
.scene.no{border-color:#f5cf61;background:#fffdf5}
#cat{position:absolute;top:1.2vh;left:1.4vw;font-size:2.3vh;font-weight:900;color:#7a5a3a;background:#fff3dc;border-radius:999px;padding:0 1.2vh;line-height:1.5}
#pic{flex:1 1 0;min-height:0;width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
#pic svg,#pic img{height:100%;width:auto;max-width:100%;display:block;border-radius:1.6vh}
#pic img{object-fit:contain;box-shadow:0 .4vh 1.2vh rgba(0,0,0,.15)}
#pic .emo{font-size:10vh;line-height:1.1}
#photoBtn{position:absolute;right:1.2vw;top:8.4vh;width:5.4vh;height:5.4vh;border-radius:50%;background:#f7efe2;font-size:2.7vh;opacity:.8;z-index:2}
#pic.wig{animation:wiggle .12s linear 5}
@keyframes bob{50%{transform:translateY(-1vh)}}
#qtext{width:100%;text-align:center;font-weight:800;cursor:pointer;flex:none}
#listenBtn{position:absolute;top:1.2vh;right:1.2vw;width:6.4vh;height:6.4vh;border-radius:50%;background:#f7efe2;font-size:3.3vh}
#pop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);font-size:14vh;pointer-events:none;opacity:0}
#pop.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.8)}}
#ask{height:5vh;text-align:center;font-weight:700;color:var(--soft);display:flex;align-items:center;justify-content:center}
.choices{height:12vh;display:grid;grid-template-columns:1fr 1fr;gap:3vw}
.choice{min-width:0;border-radius:3vh;display:flex;align-items:center;justify-content:center;gap:1.6vw;font-weight:900;border:5px solid transparent;
  box-shadow:0 1vh 0 rgba(0,0,0,.12);white-space:nowrap;overflow:hidden;transition:opacity .3s,filter .3s,transform .1s;padding:0 1.5vw}
.choice:active{transform:translateY(.6vh)}
.choice.good{background:var(--green2);color:var(--greenInk);border-color:#9ed8ac}
.choice.bad{background:var(--red2);color:var(--redInk);border-color:#f3aca5}
.choice .lbl{flex:none}
.lamp{flex:none;width:8vh;height:8vh;border-radius:50%}
.lamp.g{background:radial-gradient(circle at 35% 35%,#a6f3bb,#2fa84f 60%,#1d7a36)}
.lamp.r{background:radial-gradient(circle at 35% 35%,#ffb3aa,#e2574c 60%,#a8352b)}
.choice.dim{opacity:.32;filter:grayscale(.7)}
.choice.right{animation:glow .9s ease-in-out infinite alternate}
.choice.right.good .lamp{box-shadow:0 0 4vh 1vh #6be38c}
.choice.right.bad .lamp{box-shadow:0 0 4vh 1vh #ff8a7e}
@keyframes glow{to{transform:scale(1.03)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-1.2vw)}40%{transform:translateX(1.2vw)}60%{transform:translateX(-.8vw)}80%{transform:translateX(.8vw)}}
.feedback{height:12vh;border-radius:2.4vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2vh;padding:0 2vw}
.feedback.ok{background:#e9f8ed}
.feedback.no{background:#fff6d6}
#fb1,#fb2{width:100%;text-align:center;line-height:1.3!important}
#fb1{font-weight:900}
#fb2{font-weight:700;color:#5b4636}
.nextRow{height:8vh;display:flex;align-items:center;justify-content:center}
.nextRow.hide{visibility:hidden}
#toast{position:absolute;left:58%;top:6%;transform:translateX(-50%) scale(0);background:linear-gradient(135deg,#ff7a59,#ff4f8b);color:#fff;
  font-weight:900;font-size:4vh;padding:.6vh 2.4vh;border-radius:999px;white-space:nowrap;z-index:6;pointer-events:none;opacity:0;line-height:1.45}
#toast.tiger{background:linear-gradient(135deg,#ffa53b,#e2574c)}
#toast.go{animation:toastIn 2s ease-out}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) scale(.3) rotate(-8deg)}20%{opacity:1;transform:translateX(-50%) scale(1.12) rotate(3deg)}
  35%{transform:translateX(-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-3vh) scale(1)}}
.flystar{position:fixed;font-size:9vh;z-index:9;pointer-events:none;transition:all .8s cubic-bezier(.5,-.3,.7,1)}
#pauseVeil{position:absolute;inset:0;background:rgba(255,248,236,.85);display:none;align-items:center;justify-content:center;z-index:7;
  font-size:9vh;font-weight:900;color:#a0622a;cursor:pointer}
#pauseVeil.on{display:flex}

/* ===== 結束 ===== */
#end{flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;padding:2vh 4vw}
#end>*{flex:none}
.eicons{display:flex;align-items:flex-end;gap:3vw}
.eicons .mascot{--m:15vh}
.ecol{display:flex;flex-direction:row;align-items:center;gap:2vw}
#eBubble{max-width:46vw}
#eIcon{font-size:12vh;line-height:1.1;animation:bob 1.6s ease-in-out infinite}
#eCong{font-weight:900;color:#d9483d;text-align:center;max-width:92vw}
.badge{width:fit-content;max-width:90vw;background:linear-gradient(135deg,#ffe27a,#ffbf3c);border:6px solid #f2a81d;border-radius:999px;padding:.6vh 4vw;box-shadow:0 1vh 0 #d98d10}
#eTitle{display:block;font-weight:900;color:#7a4b00}
#eGot{font-weight:800;text-align:center;max-width:92vw}
.estars{font-size:4.6vh;min-height:5vh;max-width:90vw;text-align:center;white-space:nowrap;overflow:hidden}
.estars span{display:inline-block;animation:starIn .4s backwards}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
#eMsg{font-weight:700;color:var(--soft);text-align:center;max-width:92vw}
.erow{display:flex;gap:4vw}
#cf{position:fixed;inset:0;pointer-events:none;z-index:8;display:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 14vh 5vh rgba(255,30,30,.7);opacity:0;transition:opacity .4s}
#vignette.on{animation:vig .8s ease-in-out infinite}
@keyframes vig{0%,100%{opacity:.35}50%{opacity:1}}
body.quake{animation:quake .5s linear 2}
@keyframes quake{10%,50%,90%{transform:translate(-1.4vw,.8vh)}30%,70%{transform:translate(1.4vw,-.8vh)}}
#fx{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh;overflow:hidden}
#fx.on{display:flex}
#fx .fxText{font-weight:900;font-size:9vh;color:#fff;text-shadow:0 .6vh 0 rgba(0,0,0,.25),0 0 2vh rgba(0,0,0,.25);white-space:nowrap;position:relative;z-index:2;animation:fxPop .6s cubic-bezier(.3,1.6,.6,1) both}
@keyframes fxPop{from{transform:scale(.2) rotate(-10deg);opacity:0}}
#fx.caught{background:radial-gradient(circle,rgba(255,204,128,.95),rgba(255,112,67,.95))}
#fx .fxTiger{font-size:36vh;line-height:1;animation:pounce .8s cubic-bezier(.2,1.4,.5,1) both}
@keyframes pounce{0%{transform:translateX(70vw) rotate(40deg) scale(.4)}60%{transform:translateX(-4vw) rotate(-12deg) scale(1.15)}100%{transform:none}}
#fx .fxHeart{position:absolute;top:12vh;right:14vw;font-size:14vh;animation:heartFall 2.2s ease-in .6s both}
@keyframes heartFall{0%{transform:scale(1.4)}30%{transform:scale(1) rotate(-10deg)}100%{transform:translateY(80vh) rotate(90deg);opacity:0}}
#fx.win{background:linear-gradient(180deg,#ffe082,#ffab91)}
#fx .rays{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(rgba(255,255,255,.5) 0 10deg,rgba(255,255,255,0) 10deg 20deg);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#fx canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fx .fxBento{font-size:24vh;line-height:1;position:relative;z-index:2;animation:bentoJump .7s ease-in-out infinite alternate}
@keyframes bentoJump{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-4vh) rotate(6deg) scale(1.06)}}
#fx .rainbow{color:#fff;text-shadow:0 .5vh 0 #e2574c,0 1vh 0 #ff9f43,0 1.5vh 0 #43a047,0 2vh 1vh rgba(0,0,0,.2)}
#fx .fxKids{font-size:9vh;position:relative;z-index:2;letter-spacing:1vh}
#fx .fxKids span{display:inline-block;animation:hop .45s ease-in-out infinite}
#fx .fxKids span:nth-child(2n){animation-delay:.22s}
#fx .bigbtn{position:relative;z-index:2;font-size:5vh}

/* ===== 吉祥物燈燈 ===== */
.mascot{--m:16vh;position:relative;width:calc(var(--m)*.82);height:var(--m);flex:none;cursor:pointer;transform-origin:50% 100%}
.mascot .mhead{position:absolute;left:8%;right:8%;top:0;height:22%;background:#3d3d4a;border-radius:calc(var(--m)*.08);display:flex;align-items:center;justify-content:space-around;padding:0 4%}
.mascot .ml{width:calc(var(--m)*.13);height:calc(var(--m)*.13);border-radius:50%;transition:all .3s}
.mascot .ml.r{background:#6a3f3c}.mascot .ml.y{background:#6b6040}.mascot .ml.g{background:#3c5a44}
.mascot .mbody{position:absolute;left:0;right:0;top:19%;bottom:6%;background:linear-gradient(#ffe08a,#ffc94d);border:calc(var(--m)*.025) solid #e8a92a;border-radius:calc(var(--m)*.2) calc(var(--m)*.2) calc(var(--m)*.24) calc(var(--m)*.24)}
.mascot .eye{position:absolute;top:30%;width:calc(var(--m)*.09);height:calc(var(--m)*.12);background:#3a2a20;border-radius:50%;animation:blink 4s infinite}
.mascot .eye.l{left:24%}.mascot .eye.r{right:24%}
.mascot .eye::after{content:"";position:absolute;top:18%;left:22%;width:35%;height:30%;background:#fff;border-radius:50%}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot .cheek{position:absolute;top:52%;width:calc(var(--m)*.12);height:calc(var(--m)*.07);background:#ff9e8f;border-radius:50%;opacity:.75}
.mascot .cheek.l{left:9%}.mascot .cheek.r{right:9%}

.mascot.happy .eye::after{display:none}
.mascot.happy .mouth,.mascot.giggle .mouth,.mascot.scared .mouth{width:calc(var(--m)*.24);height:calc(var(--m)*.14);background:#e2574c;border:none;border-radius:0 0 999px 999px}

  if(role==='boy') body+=`<path d="M-9 -100 L0 -90 L9 -100" fill="none" ${S2}/><path d="M0 -90 l-3 12 l3 4 l3 -4 z" fill="${NAVY}" ${S2}/>`;

()=>BG.rest()+K({x:240,role:'dad',pose:'stand',face:'smile',s:1.15,flip:1})+K({x:150,g:'g',pose:'talk',face:'smile'})+FX.bubble(210,50,`<rect x="-14" y="-12" width="28" height="22" rx="4" fill="#fff" ${S2}/><circle cx="-6" cy="-5" r="3" fill="#1e88e5"/><rect x="-9" y="-1" width="6" height="8" fill="#1e88e5"/><circle cx="6" cy="-5" r="3" fill="#e53935"/><path d="M2 7 l4 -9 l4 9 z" fill="#e53935"/>`,.9),

];
function svg(i){ const f=SC[i]; if(!f) return ''; return `<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${f()}</svg>`; }

<!-- ===================== 遊戲程式 ===================== -->
<script>
(function(){
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const START_GAP = 3;           // 一開始虎媽媽在後面 3 步
const GOAL_RATE = 0.8;         // 答對 8 成題目就能走到營養午餐

/* ---------- 儲存 ---------- */
const KEY='mealTiger_';
const MEM={};   // 瀏覽器不能存檔時，至少在這次開啟期間記得（抽號才不會重複）
function store(k,v){ MEM[k]=JSON.parse(JSON.stringify(v)); try{ localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v = localStorage.getItem(KEY+k); if(v) return JSON.parse(v); }catch(e){} return (k in MEM) ? JSON.parse(JSON.stringify(MEM[k])) : d; }

/* ---------- 狀態 ---------- */
const CLASS_N=14;   // 班級數
const ST = Object.assign({sfx:true,read:true,exp:true,count:20,tiger:8,hearts:5,seats:30,caller:true,teams:1,cls:1,seatsBy:{},cats:CATS.map(c=>c[0])}, load('settings',{}));
ST.bgm=false; ST.cls=Math.max(1,Math.min(CLASS_N,ST.cls||1));
const DEF_IDX={}; DEFAULT_Q.forEach((q,i)=>{ DEF_IDX[q[1]]=i; });
const defPool = () => DEFAULT_Q.map((q,i)=>({p:q[0],t:q[1],a:q[2],e:q[3],c:q[4],sk:i}));
if(!load('v3',0)){ if(ST.tiger===15||ST.tiger>10) ST.tiger=8; store('v3',1); }
let pool = toPool(load('pool', null) || defPool());
let zyExtraText = load('zyExtra', '');
let ZYX={}, PHX={};
parseZyExtra(zyExtraText);
let round=[], idx=0, answers=[], bonus=0, cur='home';
let tigerPos=0, hearts=5, goal=10, reached=false, ending=false, caughtTimes=0;
let paused=false, reading=false, readTimer=null, tigerAcc=0, lastTickSec=null;
let undoStack=[], caughtT=[], lastCaught=false, sprintQ=false, wasAngry=false, spent=0;
let rolling=false, rollTimer=null, curSeat=null, wasDanger=false, beatAcc=0, fxT=null, sprintDone=false;
/* ---------- 隊伍：全班一隊，或兩隊對戰（每隊各有虎媽媽、愛心、星星） ---------- */
let TEAMS=[], act=0;
const FACES=[{n:'🐒',d:'🙈',c:'🙊',w:'🐵'},{n:'🐰',d:'🐇',c:'😵',w:'🥳'}];
const TEAM_ICON=['🐒','🐰'];
const two=()=>ST.teams===2;
function teamOf(i){ return two()? i%2 : 0; }
function teamLabel(i){ return two()? TEAM_ICON[i]+TEXT.teamName[i] : TEXT.classTag; }
function saveTeam(){ const t=TEAMS[act]; if(!t) return; Object.assign(t,{tigerPos,hearts,caughtTimes,spent,bonus,reached,goal,hinted,tigerAcc}); }
function loadTeam(i){ act=i; const t=TEAMS[i]; tigerPos=t.tigerPos; hearts=t.hearts; caughtTimes=t.caughtTimes; spent=t.spent; bonus=t.bonus; reached=t.reached; goal=t.goal; hinted=t.hinted; tigerAcc=t.tigerAcc; }
function switchTeam(i){ if(i===act||!TEAMS[i]) return; saveTeam(); loadTeam(i); wasDanger=false; wasAngry=false; }
function withTeam(i,fn){ if(i===act||!TEAMS[i]){ fn(); return; } const prev=act; saveTeam(); loadTeam(i); try{ fn(); } finally { saveTeam(); loadTeam(prev); } }
function V(i){ if(i===act) return {tigerPos,hearts,reached,goal,bonus,spent}; return TEAMS[i]; }
function correctOf(i){ return answers.filter(a=>a&&a.ok&&(a.team||0)===i).length; }
function kidPosOf(i){ return Math.min(V(i).goal, START_GAP+correctOf(i)); }
function starsOf(i){ return Math.max(0,correctOf(i)+V(i).bonus); }

function toPool(arr){
  return (Array.isArray(arr)?arr:[]).filter(q=>q && q.t && (q.a==='好'||q.a==='改'))
    .map(q=>({p:q.p||'🍽️',t:String(q.t),a:q.a,e:String(q.e||''),c:String(q.c||'其他'),sk:(typeof q.sk==='number'?q.sk:DEF_IDX[q.t])}));
}
function allCats(){
  const names = CATS.map(c=>c[0]);
  pool.forEach(q=>{ if(!names.includes(q.c)) names.push(q.c); });
  return names.filter(n=>pool.some(q=>q.c===n));
}
function catIcon(n){ const c=CATS.find(x=>x[0]===n); return c?c[1]:'⭐'; }

/* ---------- 注音 ---------- */
function parseZyExtra(txt){
  ZYX={}; PHX={};
  String(txt||'').split(/\n/).forEach(line=>{
    const m=line.split('='); if(m.length<2) return;
    const key=m[0].trim(), val=m.slice(1).join('=').trim(); if(!key||!val) return;
    const chars=[...key];
    if(chars.length===1) ZYX[key]=val.replace(/\s+/g,'');
    else { const parts=val.split(/\s+/); if(parts.length===chars.length) PHX[key]=parts; }
  });
}
function readings(text){
  const cs=[...text], out=new Array(cs.length).fill(undefined);
  const ph=Object.assign({},PH,PHX);
  const keys=Object.keys(ph).sort((a,b)=>[...b].length-[...a].length);
  for(let i=0;i<cs.length;i++){
    for(const k of keys){
      const kc=[...k];
      if(cs.slice(i,i+kc.length).join('')===k) kc.forEach((c,j)=>{ if(out[i+j]===undefined && ph[k][j]) out[i+j]=ph[k][j]; });
    }
  }
  return cs.map((c,i)=> out[i]!==undefined ? out[i] : (ZYX[c]||ZY[c]||null));
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bopo(r){
  let light=false, tone='';
  if(r[0]==='˙'){ light=true; r=r.slice(1); }
  const last=r[r.length-1];
  if('ˊˇˋ'.includes(last)){ tone=last; r=r.slice(0,-1); }
  const sy=[...r];
  let h='<span class="b"><span class="col">';
  if(light) h+='<i class="lt">˙</i>';
  sy.forEach((s,k)=>{ h += (k===sy.length-1 && tone) ? `<i>${s}<b class="tn">${tone}</b></i>` : `<i>${s}</i>`; });
  return h+'</span></span>';
}
function zy(text){
  const cs=[...text], rs=readings(text);
  return cs.map((c,i)=> rs[i] ? `<span class="zy"><span class="h">${esc(c)}</span>${bopo(rs[i])}</span>` : esc(c)).join('');
}
function missingZy(text){
  const cs=[...text], rs=readings(text), miss=new Set();
  cs.forEach((c,i)=>{ if(/[一-鿿]/.test(c) && !rs[i]) miss.add(c); });
  return [...miss];
}

/* ---------- 音效 ---------- */
let actx=null;
function ac(){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; if(!actx) actx=new AC(); if(actx.state==='suspended') actx.resume(); return actx; }
function tone(freq,start,dur,type,vol){
  const c=ac(); if(!c) return;
  const t=c.currentTime+start, o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}
function slide(f1,f2,dur,type,vol){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine';
  o.frequency.setValueAtTime(f1,c.currentTime); o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur);
  g.gain.setValueAtTime(vol||.15,c.currentTime); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur+.05);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+.1);
}
function sfx(name){
  if(!ST.sfx) return;
  if(name==='click') tone(700,0,.08,'sine',.12);
  if(name==='correct') [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28,'triangle',.22));
  if(name==='gentle'){ tone(587,0,.22,'sine',.14); tone(494,.18,.32,'sine',.14); }
  if(name==='star') tone(1319,0,.25,'triangle',.15);
  if(name==='win') [523,659,784,659,784,1047,1047,1319].forEach((f,i)=>tone(f,i*.13,.3,'triangle',.22));
  if(name==='tick') tone(1000,0,.05,'square',.04);
  if(name==='stomp'){ tone(140,0,.18,'triangle',.25); tone(110,.2,.22,'triangle',.25); }
  if(name==='roar') slide(260,140,.45,'sawtooth',.06);
  if(name==='boing') slide(300,900,.2,'sine',.15);
  if(name==='slip'){ slide(900,200,.5,'sine',.18); setTimeout(()=>tone(130,0,.25,'triangle',.25),450); }
  if(name==='combo') [784,988,1175,1568].forEach((f,i)=>tone(f,i*.07,.18,'square',.07));
  if(name==='ding'){ tone(988,0,.3,'sine',.25); tone(1319,.14,.45,'sine',.22); }
  if(name==='alarm') [0,1,2].forEach(i=>{ tone(880,i*.32,.15,'square',.07); tone(659,i*.32+.16,.15,'square',.07); });
  if(name==='beat'){ tone(70,0,.12,'sine',.5); tone(60,.17,.14,'sine',.4); }
  if(name==='roarBig'){ slide(340,110,.9,'sawtooth',.14); slide(230,80,1,'square',.06); }
  if(name==='sad') [466,440,415,370].forEach((f,i)=>tone(f,i*.36,i===3?.8:.34,'sawtooth',.07));
  if(name==='fanfare') [523,523,523,659,0,587,659,784,1047].forEach((f,i)=>{ if(f) tone(f,i*.14,i===8?.7:.18,'triangle',.24); });
  if(name==='cheer'){ noise(2.2,.35); [1047,1319,1568].forEach((f,i)=>tone(f,.9+i*.1,.4,'triangle',.12)); }
}
const MEL=[523,587,659,784,659,587,523,0,587,659,784,880,784,659,587,0,659,784,880,784,659,587,523,0];
let bgmT=null,bgmI=0;
function bgmStart(){ if(bgmT) return; bgmI=0; bgmT=setInterval(()=>{ const f=MEL[bgmI++%MEL.length]; if(f) tone(f,0,.34,'triangle',.045); },380); }
function bgmStop(){ if(bgmT){ clearInterval(bgmT); bgmT=null; } }

/* ---------- 語音 ---------- */
let voice=null;
function loadVoice(){ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/Taiwan|臺灣|台灣/.test(v.name))||vs.find(v=>/^zh/i.test(v.lang))||null; }
if('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged=loadVoice; }
function clean(t){ return String(t).replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu,'').replace(/[｜|「」]/g,'').trim(); }
function speak(text, force, onend){
  if((!ST.read && !force) || !('speechSynthesis' in window)){ if(onend) onend(false); return; }
  const c=clean(text); if(!c){ if(onend) onend(false); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(c); u.lang='zh-TW'; if(voice) u.voice=voice; u.rate=0.92; u.pitch=1.08;
  if(onend){ u.onend=()=>onend(true); u.onerror=()=>onend(true); }
  speechSynthesis.speak(u);
}
function hush(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }
/* 念題目時虎媽媽不動：念完（或自己讀題的 3 秒）才開始計時 */
let qToken=0, calling=false;
/* 念題目時虎媽媽不動；念完（或自己讀題 3 秒）才繼續。then 是念完後要做的事 */
function readQuestion(force, then){
  const q=round[idx]; if(!q) return;
  const tk=qToken, t0=Date.now(); reading=true; clearTimeout(readTimer);
  let fired=false;
  const fin=()=>{ if(fired||tk!==qToken) return; fired=true; clearTimeout(readTimer);
    const wait=Math.max(600, 2500-(Date.now()-t0));   // 至少留 2.5 秒聽／讀題目
    readTimer=setTimeout(()=>{ if(tk!==qToken) return; if(then) then(); else reading=false; },wait); };
  if(ST.read || force){
    readTimer=setTimeout(fin, Math.min(15000, 1500+[...q.t].length*450));
    speak((two()&&!force?`輪到${TEXT.teamName[act]}。`:'')+q.t, true, fin);
  } else readTimer=setTimeout(fin, 3000);
}
/* 叫號：跳號碼 → 念「請 ○ 號上台」→ 留一點時間走上台，才開始計時 */
function callSeat(){
  const tk=qToken; calling=true; reading=true;
  rollSeat(()=>{
    if(tk!==qToken) return;
    calling=false; const t1=Date.now();
    const go=()=>{ if(tk!==qToken) return; clearTimeout(readTimer);
      readTimer=setTimeout(()=>{ if(tk===qToken) reading=false; }, 300); };   // 叫完號就開始計時：走上台也要快
    readTimer=setTimeout(go,4000);
    speak(`請${curSeat}號上台。`, false, go);
  });
}
function startQuestion(){
  qToken++; reading=true;
  if(!ST.caller){ readQuestion(false); return; }
  calling=true; const el=$('#caller'); el.style.display=''; el.classList.remove('land','rolling');
  $('#clTop').innerHTML='👂 '+zy(TEXT.listenFirst); fitEl($('#clTop'),.024); $('#clNum').textContent='??';
  readQuestion(false, callSeat);
}

/* ---------- 小工具 ---------- */
const recent={};
function pickNR(arr,key){ recent[key]=recent[key]||[]; let o=arr.filter(x=>!recent[key].includes(x)); if(!o.length) o=arr;
  const v=o[Math.random()*o.length|0]; recent[key].push(v); if(recent[key].length>Math.min(2,arr.length-1)) recent[key].shift(); return v; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- 文字自動縮放 ---------- */
const FITS=[
  ['#toolbar',.03],['#hTitle',.075],['#hSub',.038],['.rule',.032],['.srow',.031],['#startBtn',.05],
  ['#prog',.036],['#hearts',.038],['#qtext',.068],['#clTop',.024],['.choice',.075],['#fb1',.04],['#fb2',.035],['#nextBtn',.045],
  ['#mBubble',.036],['#eBubble',.042],['#eCong',.062],['#eTitle',.068],['#eGot',.048],['#eMsg',.04],['#againBtn',.048],['#homeBtn',.048]
];
function fitEl(el,base){ const min=el.id==='toolbar'?8:11; let s=Math.max(min,Math.round(innerHeight*base)); el.style.fontSize=s+'px'; let g=0;
  while(el.scrollWidth>el.clientWidth+1 && s>min && g++<200){ s-=1; el.style.fontSize=s+'px'; } }
function fitAll(){ FITS.forEach(([sel,b])=>$$(sel).forEach(el=>{ if(el.offsetParent!==null||el.id==='toolbar') fitEl(el,b); })); }
window.addEventListener('resize',()=>requestAnimationFrame(()=>{ fitAll(); if(cur==='game') paintTrack(); }));

/* ---------- 吉祥物 ---------- */
const MASCOT_HTML='<div class="mhead"><span class="ml r"></span><span class="ml y"></span><span class="ml g"></span></div>'+
  '<span class="arm l"></span><span class="arm r"></span><div class="mbody"><span class="eye l"></span><span class="eye r"></span>'+
  '<span class="cheek l"></span><span class="cheek r"></span><span class="mouth"></span></div><span class="foot l"></span><span class="foot r"></span>';
['#mHome','#mGame','#mEnd'].forEach(s=>{ $(s).innerHTML=MASCOT_HTML; });
const moodBack={};
function setMood(el,mood){ el.className='mascot'; void el.offsetWidth; el.className='mascot '+mood; }
function setBubble(el,text){ el.innerHTML=zy(text); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  const base=el.id==='mBubble'?.036:el.id==='eBubble'?.042:.042; requestAnimationFrame(()=>fitEl(el,base)); }
function tapMascot(el){
  const prev=el.className.replace('mascot','').replace(/giggle|scared/,'').trim()||'idle';
  setMood(el,'giggle');
  if(ST.sfx){ tone(880,0,.08,'square',.06); tone(1175,.09,.08,'square',.06); tone(1480,.18,.12,'square',.06); }
  const t=pickNR(TEXT.mTap,'tap');
  if(el.id==='mGame') setBubble($('#mBubble'),t);
  if(!reading) speak(t.replace('嗨嗨','嗨'),true);
  clearTimeout(moodBack[el.id]); moodBack[el.id]=setTimeout(()=>setMood(el,prev),1100);
}
['#mHome','#mGame','#mEnd'].forEach(s=>$(s).addEventListener('click',()=>tapMascot($(s))));
$('#pic').addEventListener('click',()=>{ const p=$('#pic'); p.classList.remove('wig'); void p.offsetWidth; p.classList.add('wig'); sfx('boing'); });
function toast(html,cls){ const t=$('#toast'); t.className=cls||''; t.innerHTML=html; void t.offsetWidth; t.className=(cls||'')+' go'; }

/* ---------- 首頁 ---------- */
function filteredPool(){ return pool.filter(q=>ST.cats.includes(q.c)); }
function paintHome(){
  $('#hTitle').innerHTML='🍱 '+zy(TEXT.title);
  $('#hSub').innerHTML='💬 '+zy(TEXT.hi);
  $('#r1').innerHTML='<span class="mini g"></span><span>'+zy(TEXT.rA)+'</span>　<span class="mini r"></span><span>'+zy(TEXT.rB)+'</span>';
  $('#r2').innerHTML='<span class="ri">⭐</span><span>'+zy(TEXT.r3)+'</span>';
  $('#r3').innerHTML='<span class="ri">🐢</span><span>'+zy(TEXT.r4)+'</span>';
  $('#r4').innerHTML='<span class="ri">🐯</span><span>'+zy(TEXT.r5)+'</span>';
  // 主題
  const cats=allCats(); ST.cats=ST.cats.filter(c=>cats.includes(c)); if(!ST.cats.length) ST.cats=cats.slice();
  const allOn=ST.cats.length===cats.length;
  $('#rowCat').innerHTML='<span class="slabel">📚 '+zy(TEXT.sCat)+'</span>'+
    `<button class="opt cat ${allOn?'on':''}" data-cat="*">${zy(TEXT.all)}</button>`+
    cats.map(c=>`<button class="opt cat ${ST.cats.includes(c)&&!allOn?'on':''}" data-cat="${esc(c)}">${catIcon(c)}${zy(c)}</button>`).join('');
  // 題數
  const avail=filteredPool().length;
  const counts=[10,15,20,30,50].filter(n=>n<avail);
  if(!counts.includes(ST.count) && ST.count!==avail) ST.count=Math.min(20,avail);
  if(ST.count>avail) ST.count=avail;
  $('#rowCount').innerHTML='<span class="slabel">🔢 '+zy(TEXT.sCount)+'</span>'+
    counts.map(n=>`<button class="opt ${ST.count===n?'on':''}" data-count="${n}">${n}</button>`).join('')+
    `<button class="opt ${ST.count===avail?'on':''}" data-count="${avail}">${zy(TEXT.all)} ${avail}</button>`+
    '<span style="display:inline-block;width:2.5vw"></span><span class="slabel" style="min-width:0">👥 '+zy(TEXT.sMode)+'</span>'+
    `<button class="opt ${ST.teams===1?'on':''}" data-teams="1">🐒${zy(TEXT.modeAll)}</button><button class="opt ${ST.teams===2?'on':''}" data-teams="2">🐒🆚🐰${zy(TEXT.modeTeam)}</button>`;
  // 虎媽媽速度
  $('#rowTiger').innerHTML='<span class="slabel">🐯 '+zy(TEXT.sTiger)+'</span>'+
    [5,8,10,15].map(n=>`<button class="opt ${ST.tiger===n?'on':''}" data-tiger="${n}">${zy(TEXT.sec.replace('{n}',n))}</button>`).join('')+
    `<button class="opt ${ST.tiger===0?'on':''}" data-tiger="0">${zy(TEXT.noChase)}</button>`;
  // 愛心
  $('#rowHeart').innerHTML='<span class="slabel">❤️ '+zy(TEXT.sHeart)+'</span>'+
    [3,5,10].map(n=>`<button class="opt ${ST.hearts===n?'on':''}" data-heart="${n}">${zy(TEXT.heartN.replace('{n}',n))}</button>`).join('')+
    '<span style="display:inline-block;width:3vw"></span>'+
    `<button class="opt ${ST.caller?'':'on'}" data-calleroff="1">🙋${zy(TEXT.seatOff)}</button>`;
  // 班級：每一班有自己的座號人數和抽號紀錄

/* ---------- 出題：好、改各半，盡量避開上一輪 ---------- */
function pickRound(){
  const src=filteredPool(), n=Math.min(ST.count, src.length);
  const last=load('lastUsed',[]);
  const prefer=arr=>shuffle(arr).sort((a,b)=>(last.includes(a.t)?1:0)-(last.includes(b.t)?1:0));
  const goods=prefer(src.filter(q=>q.a==='好')), bads=prefer(src.filter(q=>q.a==='改'));
  let ng=Math.min(Math.floor(n/2),goods.length), nb=Math.min(n-ng,bads.length); ng=Math.min(n-nb,goods.length);
  const pick=goods.slice(0,ng).concat(bads.slice(0,nb));
  let best=shuffle(pick);
  for(let t=0;t<60;t++){ let run=1,ok=true; for(let i=1;i<best.length;i++){ run=best[i].a===best[i-1].a?run+1:1; if(run>3){ok=false;break;} } if(ok) break; best=shuffle(pick); }
  store('lastUsed',best.map(q=>q.t).concat(last).slice(0,80));
  return best;
}

  if(!ST.caller || n<=0 || n>=ST.seats){ startGame(); return; }
  dialog({title:'🙋 第 '+ST.cls+' 班的叫號',
    msg:'這一班已經抽過 '+n+'／'+ST.seats+' 位小朋友。要接著抽還沒上台的小朋友，還是全部重新抽？',
    okText:'▶ 接著抽', onOk:()=>startGame(),
    extra:[{text:'🔄 重新抽', fn:()=>{ resetDecks(); startGame(); }}]});
}
function resetDecks(){ [-1,0,1].forEach(t=>{ const k=deckKey(t); store(k,[]); try{ localStorage.removeItem(KEY+k); }catch(e){} delete MEM[k]; }); }
function seatDeck(){ let d=load(deckKey(),null); if(!Array.isArray(d)||!d.length) d=shuffle(seatList()); return d; }
function drawSeat(){ const d=seatDeck(); let n=d.pop(); if(n===curSeat && d.length){ d.unshift(n); n=d.pop(); } store(deckKey(),d); return n; }
const pad2=n=>String(n).padStart(2,'0');
const ROLL_MS=1200;

function rollSeat(then){
  const el=$('#caller');
  if(!ST.caller){ el.style.display='none'; if(then) then(); return; }
  el.style.display=''; rolling=true; clearInterval(rollTimer);
  const target=drawSeat(); el.classList.remove('land'); el.classList.add('rolling');
  $('#clTop').innerHTML='🔄 '+zy(TEXT.callNext); fitEl($('#clTop'),.024);
  const t0=Date.now(); let lastSec=0; sfx('tick');
  rollTimer=setInterval(()=>{
    const el2=Date.now()-t0; if(el2-lastSec>=200){ lastSec=el2; sfx('tick'); }
    { const L=seatList(); $('#clNum').textContent=pad2(L[Math.random()*L.length|0]); }
    if(el2>=ROLL_MS){
      clearInterval(rollTimer); curSeat=target; $('#clNum').textContent=pad2(target);
      el.classList.remove('rolling'); void el.offsetWidth; el.classList.add('land');
      $('#clTop').innerHTML=(two()?TEAM_ICON[act]:'🙋')+' '+zy(TEXT.caller); fitEl($('#clTop'),.024);
      sfx('ding'); rolling=false; if(then) then();
    }
  },90);
}

/* ---------- 題目圖片：老師照片 > 內建插圖 > 表情符號 ---------- */
let photoDB=null; const photoCache={};
function idb(){ return new Promise(res=>{ if(photoDB) return res(photoDB); try{ const r=indexedDB.open('mealTigerPhotos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>{ photoDB=r.result; res(photoDB); }; r.onerror=()=>res(null); }catch(e){ res(null); } }); }
async function photoGet(k){ const db=await idb(); if(!db) return null; return new Promise(res=>{ try{ const t=db.transaction('p').objectStore('p').get(k); t.onsuccess=()=>res(t.result||null); t.onerror=()=>res(null); }catch(e){ res(null); } }); }
async function photoPut(k,v){ const db=await idb(); if(!db) return false; return new Promise(res=>{ try{ const st=db.transaction('p','readwrite').objectStore('p'); const t=v?st.put(v,k):st.delete(k); t.onsuccess=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } }); }
function qKey(q){ return typeof q.sk==='number' ? 'd'+q.sk : 't:'+q.t; }
function drawArt(q){ const svg = typeof q.sk==='number' ? ART.svg(q.sk) : ''; $('#pic').innerHTML = svg || `<span class="emo">${esc(q.p)}</span>`; }
function paintPic(q){
  const k=qKey(q), ph=photoCache[k];
  if(ph){ $('#pic').innerHTML=`<img src="${ph}" alt="">`; return; }
  drawArt(q);
  if(ph===undefined) photoGet(k).then(v=>{ photoCache[k]=v; if(v && round[idx]===q) $('#pic').innerHTML=`<img src="${v}" alt="">`; });
}
function shrinkImg(file){ return new Promise(res=>{ const r=new FileReader();
  r.onload=()=>{ const im=new Image(); im.onload=()=>{ const sc=Math.min(1,900/Math.max(im.width,im.height)); const c=document.createElement('canvas');
    c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); };
    im.onerror=()=>res(null); im.src=r.result; };
  r.onerror=()=>res(null); r.readAsDataURL(file); }); }
$('#photoBtn').addEventListener('click',e=>{
  e.stopPropagation(); if(cur!=='game') return;
  const q=round[idx], k=qKey(q);
  dialog({title:'📷 換成照片（老師用）', msg:'可以拍學校的餐具、打菜台、洗手台或桌面。請不要拍到學生的臉。照片只會存在這台電腦的這個瀏覽器裡。',
    okText:'選擇照片', onOk:()=>$('#photoIn').click(),

$('#photoIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f||cur!=='game') return;

let fwRaf=null;
function fireworks(c){
  const ctx=c&&c.getContext&&c.getContext('2d'); if(!ctx) return;
  c.width=innerWidth; c.height=innerHeight;
  const P=[], cols=['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb','#ffab40','#ffffff']; let next=0;
  function burst(){ const x=c.width*(.12+Math.random()*.76), y=c.height*(.12+Math.random()*.4), col=cols[Math.random()*cols.length|0];
    for(let i=0;i<80;i++){ const a=Math.random()*Math.PI*2, v=2+Math.random()*6; P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:col}); }
    if(ST.sfx) slide(180,50,.35,'triangle',.18); }
  function step(t){
    if(t>next){ burst(); next=t+300+Math.random()*400; }
    ctx.clearRect(0,0,c.width,c.height);
    for(const p of P){ p.x+=p.vx; p.y+=p.vy; p.vy+=.07; p.vx*=.985; p.l-=.011; ctx.globalAlpha=Math.max(0,p.l); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,3.2,0,7); ctx.fill(); }
    for(let i=P.length-1;i>=0;i--) if(P[i].l<=0) P.splice(i,1);
    ctx.globalAlpha=1; fwRaf=requestAnimationFrame(step);
  }
  fwRaf=requestAnimationFrame(step);
}
function stopFireworks(){ if(fwRaf) cancelAnimationFrame(fwRaf); fwRaf=null; }
function noise(dur,vol){ const c=ac(); if(!c) return; const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++){ const env=Math.min(1,i/(n*.15))*(1-i/n); d[i]=(Math.random()*2-1)*env; }
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400; f.Q.value=.5;
  const g=c.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(c.destination); s.start(); }

function showEnd(reason){
  ending=false;

  const answered=answers.filter(Boolean).length, ok=correctCount(), n=totalStars();
  const ratio = answered ? ok/answered : 0;
  let title,icon;
  if(ratio>=0.95 && answered>0){ title=TEXT.t10; icon='🏆'; }
  else if(ratio>=0.7){ title=TEXT.t7; icon='🥇'; }

    $('#eIcon').textContent='🐯💤';

function showEndTeams(reason){
  saveTeam();

  if(reason==='goal') win=act;
  else if(reason==='teamOut') win=1-act;
  else { const a=kidPosOf(0), b=kidPosOf(1); win = a===b ? -1 : (a>b?0:1); }
  const answered=answers.filter(Boolean).length, ok=answers.filter(a=>a&&a.ok).length, ratio=answered?ok/answered:0;
  const title = ratio>=0.95&&answered>0 ? TEXT.t10 : ratio>=0.7 ? TEXT.t7 : TEXT.t0;
  show('end');

    $('#eIcon').textContent='🐒🤝🐰';
    $('#eCong').innerHTML='🎉 '+zy(TEXT.tie)+' 🎉';
    setBubble($('#eBubble'),TEXT.clap);
  } else {
    $('#eIcon').textContent=TEAM_ICON[win]+'🏆';
    $('#eCong').innerHTML='🎉 '+TEAM_ICON[win]+zy(reason==='goal'?TEXT.teamFirst.replace('{t}',TEXT.teamName[win]):TEXT.teamWin.replace('{t}',TEXT.teamName[win]))+' 🎉';

  }
  setMood($('#mEnd'),'happy'); $('#mEnd').style.animationIterationCount='infinite';
  $('#eTitle').innerHTML=zy(title);
  $('#eGot').innerHTML=[0,1].map(i=>`${TEAM_ICON[i]}${zy(TEXT.teamName[i])} ⭐${starsOf(i)}`).join('　　');
  $('#eStars').innerHTML='';

  setTimeout(()=>{ if(cur==='end') speak((win<0?TEXT.tie:TEXT.teamWin.replace('{t}',TEXT.teamName[win]))+'給自己拍拍手！'); },900);
}
let cfRaf=null;
function confetti(){
  const c=$('#cf'); const ctx=c.getContext&&c.getContext('2d'); if(!ctx) return;
  c.width=innerWidth; c.height=innerHeight; c.style.display='block';
  const cols=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff9f43','#c77dff'];
  const mk=init=>({x:Math.random()*c.width,y:init?-Math.random()*c.height:-20,vx:(Math.random()-.5)*2.2,vy:2+Math.random()*3.5,s:8+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[Math.random()*cols.length|0],star:Math.random()<.3});
  const ps=Array.from({length:170},()=>mk(true)); const t0=performance.now();
  function step(t){ ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(p.y>c.height+30&&t-t0<5000) Object.assign(p,mk(false));
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
      if(p.star){ ctx.font=(p.s*2)+'px sans-serif'; ctx.fillText('★',-p.s,p.s); } else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t-t0<8500&&cur==='end') cfRaf=requestAnimationFrame(step); else stopConfetti(); }
  cfRaf=requestAnimationFrame(step);
}
function stopConfetti(){ if(cfRaf) cancelAnimationFrame(cfRaf); cfRaf=null; $('#cf').style.display='none'; }

function poolToText(p){ return p.map(q=>[q.p,q.t,q.a,q.e,q.c].join('｜')).join('\n'); }
function textToPool(txt){
  const out=[];
  txt.split(/\n/).forEach(line=>{
    const parts=line.split(/[｜|]/).map(s=>s.trim()); if(parts.length<3) return;
    let p,t,a,e,c;
    if(/^[好改]/.test(parts[1]) && parts.length<5){ p='🍽️'; [t,a,e,c]=parts; }
    else [p,t,a,e,c]=parts;
    if(!t||!a) return;
    if(a.startsWith('好')) a='好'; else if(a.includes('改')) a='改'; else return;
    out.push({p:p||'🍽️',t,a,e:e||'',c:c||'其他'});
  });
  return out;
}
function checkZy(){
  parseZyExtra($('#zyTA').value);
  const items=textToPool($('#bankTA').value), miss=new Set();
  items.forEach(q=>[q.t,q.e,q.c].forEach(s=>missingZy(s).forEach(ch=>miss.add(ch))));
  $('#zyWarn').textContent = miss.size ? '這些字還沒有注音，請在下面「注音補充」加上：'+[...miss].join('、') : '✅ 題數 '+items.length+' 題，注音都齊全。';
  parseZyExtra(zyExtraText);
}

/* 取消：按錯秩序時，虎媽媽退回一格；如果那一格讓虎媽媽追上，愛心也還回來 */
function undoOrder(){
  if(cur!=='game'||!undoStack.length) return;
  if(ending && !undoStack[undoStack.length-1].caught) return;   // 是時間到被追上的，不能取消
  revertRec(undoStack.pop());
  setMood($('#mGame'),'happy'); setBubble($('#mBubble'),TEXT.undo);
  toast('↩️ '+zy(TEXT.undo)); sfx('boing'); speak(TEXT.undo,true);
  paintUndo();

function revertRec(rec){
  withTeam(rec.team||0,()=>{
    if(rec.caught){
      (rec.timers||[]).forEach(clearTimeout); fxHide();
      hearts=rec.hearts; caughtTimes=rec.caughtTimes; tigerPos=rec.prevPos; ending=false;
    } else tigerPos=Math.max(0,tigerPos-1);
    tigerAcc=0;
  });
  paintHearts(false); paintTrack(); paintTimer();
}
function paintUndo(){ const b=$('#tbUndo'); b.disabled=!undoStack.length; b.classList.toggle('off',!undoStack.length); }
$('#buyBanana').onclick=()=>{
  if(cur!=='game'||ending||reached||!ST.tiger||wallet()<3||tigerPos<=0) return;
  spent+=3; tigerPos=Math.max(0,tigerPos-2); tigerAcc=0;
  const t=laneEl(act).querySelector('.tig'); t.classList.remove('slip','stomp'); void t.offsetWidth; t.classList.add('slip');
  sfx('slip'); toast('🍌 '+zy(TEXT.banana)); speak(TEXT.banana,true);
  setMood($('#mGame'),'happy'); setBubble($('#mBubble'),TEXT.banana);
  paintStars(true); paintTrack(); paintTimer();
};
$('#buyHeart').onclick=()=>{
  if(cur!=='game'||ending||reached||wallet()<5) return;
  spent+=5; hearts++; sfx('star'); toast('❤️ '+zy(TEXT.buyHeart)); speak(TEXT.buyHeart,true);
  paintStars(true); paintHearts(false);
};
$('#tbTiger').onclick=orderStep;
$('#tbUndo').onclick=undoOrder;
$('#tbSfx').onclick=()=>{ ST.sfx=!ST.sfx; paintToggles(); sfx('click'); };
$('#tbBgm').onclick=()=>{ ST.bgm=!ST.bgm; ac(); ST.bgm?bgmStart():bgmStop(); paintToggles(); };
$('#tbRead').onclick=()=>{ ST.read=!ST.read; if(!ST.read) hush(); paintToggles(); sfx('click'); };
$('#tbExp').onclick=()=>{ ST.exp=!ST.exp; paintToggles(); sfx('click'); requestAnimationFrame(fitAll); };
$('#tbBank').onclick=()=>{ sfx('click'); openBank(); };
$('#tbHome').onclick=()=>{ sfx('click');
  if(cur==='game' && answers.some(Boolean)) dialog({title:'🏠 回到首頁？',msg:'這一輪的進度會清除。',okText:'回首頁',onOk:()=>show('home')});
  else show('home'); };
document.addEventListener('keydown',e=>{
  if($('#modal').classList.contains('on') || $('#dlg').classList.contains('on')) return;
  if(cur==='home' && e.key==='Enter'){ askThenStart(); return; }
  if(cur!=='game') return;
  if(e.key===' '){ e.preventDefault(); togglePause(); }
  else if(e.key==='1') answer('好');
  else if(e.key==='2') answer('改');
  else if(e.key==='ArrowRight'||(e.key==='Enter'&&answers[idx])) goNext();
  else if(e.key==='ArrowLeft') goPrev();
  else if(e.key==='t'||e.key==='T') orderStep();
  else if(e.key==='z'||e.key==='Z') undoOrder();
});

/* ---------- 開始 ---------- */
paintStatic(); show('home');
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll);
window.__mealGame={ drawOne:()=>{ const n=drawSeat(); curSeat=n; return n; }, draw:(m)=>{ const saved=ST.teams; ST.teams=m||1; const out=[]; for(let i=0;i<ST.seats*2;i++){ const n=drawSeat(); curSeat=n; out.push(n); } ST.teams=saved; return out; }, get state(){ return {act,teams:TEAMS.length,T:TEAMS.map((t,i)=>({tiger:V(i).tigerPos,hearts:V(i).hearts,kid:kidPosOf(i),stars:starsOf(i)})),undo:undoStack.map(r=>r.caught),cur,idx,answers,round,bonus,stars:totalStars(),tigerPos,kid:kidPos(),goal,hearts,reached,reading,paused}; },
  zy, missingZy, pool:()=>pool, setTigerAcc:v=>{tigerAcc=v;}, tigerStep:()=>tigerStep() };
})();
</script>
